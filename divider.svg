<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="divider">
<title>divider</title>
<defs>
  <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b8915a" stop-opacity="0"/><stop offset=".5" stop-color="#b8915a" stop-opacity=".85"/><stop offset="1" stop-color="#b8915a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d6b27a" stop-opacity="0"/><stop offset=".5" stop-color="#d6b27a"/><stop offset="1" stop-color="#d6b27a" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .sweep{animation:sw 7s ease-in-out infinite}
  @keyframes sw{0%{transform:translateX(-160px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(760px);opacity:0}}
  .dia{transform-box:fill-box;transform-origin:center;animation:dp 4s ease-in-out infinite}
  @keyframes dp{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.35)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0" y="13.5" width="900" height="1.2" fill="url(#l)"/>
<rect class="sweep" x="0" y="13" width="140" height="2" fill="url(#s)"/>
<rect x="424.0" y="12.5" width="3" height="3" fill="#b8915a" opacity=".7" transform="rotate(45 425.5 14)"/>
<rect x="473.0" y="12.5" width="3" height="3" fill="#b8915a" opacity=".7" transform="rotate(45 474.5 14)"/>
<rect class="dia" x="445.0" y="9" width="10" height="10" fill="#c2693a"/>
</svg>
