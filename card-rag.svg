<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="440" height="270" role="img" aria-label="RAG + Evaluation: fully local document Q&amp;A that cites its sources and abstains when the answer is not in the documents. Hybrid BM25 and TF-IDF search, calculator and SQL routing, eval and red-team commands." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>RAG + Evaluation</title>
<defs>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1612"/><stop offset="1" stop-color="#0f0d0c"/></linearGradient>
  <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0">
    <stop offset="0" stop-color="#b8915a" stop-opacity="0"/><stop offset=".5" stop-color="#b8915a"/><stop offset="1" stop-color="#7c2d2b" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#b8915a" stop-opacity=".16"/><stop offset="1" stop-color="#b8915a" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="440" height="270" rx="14"/></clipPath>
</defs>
<style>
  .sh{animation:sh 6s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.35}50%{opacity:1}}
  .dot{transform-box:fill-box;transform-origin:center;animation:dp 2.6s ease-in-out infinite}
  @keyframes dp{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="440" height="270" fill="url(#p)"/>
  <rect width="440" height="270" fill="url(#g)"/>
  <rect class="sh" x="0" y="0" width="440" height="3" fill="url(#a)"/>
</g>
<rect x=".5" y=".5" width="439" height="269" rx="14" fill="none" stroke="#2e2823"/>

<rect x="28" y="24" width="228.0" height="22" rx="11" fill="none" stroke="#8a9770" stroke-opacity=".7"/>
<circle class="dot" cx="41" cy="35" r="3" fill="#8a9770"/>
<text x="52" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="1.2" fill="#ebe4d6">FULLY LOCAL · NO API KEYS</text>

<text x="28" y="82" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="25" font-weight="700" letter-spacing=".5" fill="#ebe4d6">RAG + Evaluation</text>
<text x="28" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#9a9184">Answers from your documents with citations,</text><text x="28" y="124" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#9a9184">and abstains when the answer isn’t there.</text>
<text x="28" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="2" fill="#c2693a">FEATURES</text>
<text x="28" y="176" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#ebe4d6">Hybrid BM25 + TF-IDF search, calculator and SQL</text><text x="28" y="194" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#ebe4d6">routing, built-in eval and red-team commands.</text>
<rect x="28.0" y="222" width="59.6" height="22" rx="11" fill="#ffffff" fill-opacity=".05" stroke="#d6b27a" stroke-opacity=".55"/><text x="57.8" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#ebe4d6">Python</text><rect x="93.4" y="222" width="46.3" height="22" rx="11" fill="#ffffff" fill-opacity=".05" stroke="#d6b27a" stroke-opacity=".55"/><text x="116.6" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#ebe4d6">BM25</text><rect x="145.5" y="222" width="59.6" height="22" rx="11" fill="#ffffff" fill-opacity=".05" stroke="#d6b27a" stroke-opacity=".55"/><text x="175.3" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#ebe4d6">SQLite</text><rect x="210.9" y="222" width="72.8" height="22" rx="11" fill="#ffffff" fill-opacity=".05" stroke="#d6b27a" stroke-opacity=".55"/><text x="247.3" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#ebe4d6">Red-team</text>
</svg>
