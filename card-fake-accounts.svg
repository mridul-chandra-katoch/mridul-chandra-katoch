<rect x="28" y="24" width="250.8" height="22" rx="11" fill="none" stroke="#8a9770" stroke-opacity=".7"/>
<circle class="dot" cx="41" cy="35" r="3" fill="#8a9770"/>
<text x="52" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="1.2" fill="#ebe4d6">TEAM LEAD · RESEARCH PROJECT</text>

