  <g class="glow1"><circle cx="900" cy="120" r="330" fill="url(#gB)"/></g>
  <g class="glow2"><circle cx="150" cy="330" r="360" fill="url(#gO)"/></g>
  <rect width="1200" height="340" filter="url(#grain)" opacity=".55"/>

  <g fill="none" stroke="#b8915a">
    <circle cx="1060" cy="170" r="70" stroke-opacity=".30"/>
