    <circle class="node" cx="951.2" cy="119.3" r="3.4" fill="#d6b27a" style="animation-delay:0s"/><circle class="node" cx="1028.9" cy="54.1" r="3.4" fill="#b8915a" style="animation-delay:0.6s"/><circle class="node" cx="1137.1" cy="78.1" r="3.4" fill="#b8915a" style="animation-delay:1.2s"/><circle class="node" cx="1175.9" cy="201.1" r="3.4" fill="#d6b27a" style="animation-delay:1.8s"/><circle class="node" cx="1101.0" cy="282.8" r="3.4" fill="#b8915a" style="animation-delay:2.4s"/><circle class="node" cx="968.1" cy="247.1" r="3.4" fill="#b8915a" style="animation-delay:0.3s"/><circle class="node" cx="887.7" cy="200.4" r="2.6" fill="#d6b27a" style="animation-delay:0.9s"/><circle class="node" cx="952.3" cy="32.1" r="2.6" fill="#b8915a" style="animation-delay:1.5s"/><circle class="node" cx="1105.3" cy="1.0" r="2.6" fill="#b8915a" style="animation-delay:2.1s"/><circle class="node" cx="1224.4" cy="110.1" r="2.6" fill="#d6b27a" style="animation-delay:2.7s"/><circle class="node" cx="1194.1" cy="282.5" r="2.6" fill="#b8915a" style="animation-delay:0.2s"/><circle class="node" cx="1029.6" cy="342.3" r="2.6" fill="#b8915a" style="animation-delay:1.1s"/>
  </g>

  <rect width="1200" height="340" fill="url(#vig)"/>

  <g class="fade" style="animation-delay:.1s">
    <path d="M60 92 l5 5 -5 5 -5 -5z" fill="#c2693a"/>
    <text x="78" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="3" fill="#9a9184">B.TECH · AI &amp; DATA SCIENCE · CGC UNIVERSITY, MOHALI</text>
  </g>
  <text class="fade" style="animation-delay:.3s" x="68" y="182" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="68" font-weight="700" letter-spacing="5" fill="url(#nameG)">MRIDUL KATOCH</text>
  <line class="rule" x1="72" y1="208" x2="432" y2="208" stroke="url(#rule)" stroke-width="2" stroke-linecap="round"/>
  <path class="fade" style="animation-delay:1.8s" d="M72 246 l6 6 -6 6 -6 -6z" fill="#c2693a"/>
  <text class="tag tag1" x="96" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#d6b27a">Aspiring Applied AI Engineer</text><text class="tag tag2" x="96" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#d6b27a">PyTorch · FastAPI · Computer Vision</text><text class="tag tag3" x="96" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#d6b27a">Next: RAG · Agents · Evaluation</text>

  <g class="fade" style="animation-delay:2s">
    <rect x="68" y="288" width="318" height="30" rx="15" fill="none" stroke="#8a9770" stroke-opacity=".6"/>
    <circle class="live" cx="90" cy="303" r="4" fill="#8a9770"/>
    <text x="106" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1.6" fill="#ebe4d6">OPEN TO AI / ML INTERNSHIPS</text>
