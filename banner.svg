    <circle class="spin2" cx="1060" cy="170" r="235" stroke-opacity=".20" stroke-dasharray="1 14"/>
    <circle cx="1060" cy="170" r="300" stroke-opacity=".10"/>
  </g>
  <g class="spin" style="animation-duration:180s">
