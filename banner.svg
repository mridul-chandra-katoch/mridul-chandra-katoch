<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Mridul Katoch</title>
<desc id="d">Banner: Mridul Katoch, B.Tech AI and Data Science student, aspiring Applied AI Engineer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0a09"/><stop offset=".55" stop-color="#17120e"/><stop offset="1" stop-color="#090808"/>
  </linearGradient>
  <radialGradient id="gB" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#b8915a" stop-opacity=".34"/><stop offset="1" stop-color="#b8915a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gO" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#7c2d2b" stop-opacity=".55"/><stop offset="1" stop-color="#7c2d2b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
  </radialGradient>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ebe4d6"/><stop offset=".7" stop-color="#ebe4d6"/><stop offset="1" stop-color="#d6b27a"/>
  </linearGradient>
  <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="432" y2="0">
    <stop offset="0" stop-color="#b8915a"/><stop offset="1" stop-color="#c2693a"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .78  0 0 0 .11 0"/>
  </filter>
  <clipPath id="clip"><rect width="1200" height="340" rx="16"/></clipPath>
</defs>
<style>
  .glow1{animation:d1 16s ease-in-out infinite alternate}
  .glow2{animation:d2 19s ease-in-out infinite alternate}
  @keyframes d1{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
  @keyframes d2{from{transform:translate(0,0)}to{transform:translate(70px,-30px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 140s linear infinite}
  .spin2{transform-box:fill-box;transform-origin:center;animation:spin 220s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .node{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
  .rule{stroke-dasharray:360;animation:draw 1.6s .5s ease-out backwards}
  @keyframes draw{from{stroke-dashoffset:360}}
  .fade{animation:fin 1.1s ease-out backwards}
  @keyframes fin{from{opacity:0}}
  .tag{opacity:0;animation:cyc 12s ease-in-out infinite both}
  .tag1{opacity:1;animation-delay:1.2s} .tag2{animation-delay:5.2s} .tag3{animation-delay:9.2s}
  @keyframes cyc{0%{opacity:0;transform:translateY(8px)}5%,29%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-6px)}}
  .live{transform-box:fill-box;transform-origin:center;animation:live 2.4s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
