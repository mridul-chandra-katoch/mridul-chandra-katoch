<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="440" height="270" role="img" aria-label="Planned project: deployed RAG system with measured evaluation. Not started yet.">
<title>Deployed RAG + Evaluation</title>
<defs>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1612"/><stop offset="1" stop-color="#0f0d0c"/></linearGradient>
  <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0">
    <stop offset="0" stop-color="#7f949e" stop-opacity="0"/><stop offset=".5" stop-color="#7f949e"/><stop offset="1" stop-color="#7f949e" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#7f949e" stop-opacity=".16"/><stop offset="1" stop-color="#7f949e" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="440" height="270" rx="14"/></clipPath>
</defs>
<style>
  .sh{animation:sh 6s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.35}50%{opacity:1}}
  .dot{transform-box:fill-box;transform-origin:center;animation:dp 2.6s ease-in-out infinite}
  @keyframes dp{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="440" height="270" fill="url(#p)"/>
  <rect width="440" height="270" fill="url(#g)"/>
  <rect class="sh" x="0" y="0" width="440" height="3" fill="url(#a)"/>
</g>
<rect x=".5" y=".5" width="439" height="269" rx="14" fill="none" stroke="#7f949e" stroke-opacity=".55" stroke-dasharray="6 5"/>

<rect x="28" y="24" width="197.6" height="22" rx="11" fill="none" stroke="#7f949e" stroke-opacity=".7"/>
<circle class="dot" cx="41" cy="35" r="3" fill="#7f949e"/>
<text x="52" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="1.2" fill="#ebe4d6">PLANNED · NO REPO YET</text>

<text x="28" y="82" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="22" font-weight="700" letter-spacing=".5" fill="#ebe4d6">Deployed RAG + Evaluation</text>
<text x="28" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#9a9184">Retrieval over a real document set, served</text><text x="28" y="124" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#9a9184">through a live endpoint.</text>
<text x="28" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="2" fill="#7f949e">THE BAR</text>
