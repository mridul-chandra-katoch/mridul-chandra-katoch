<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" width="900" height="338" role="img" aria-label="Timeline, newest first. July 2026 to now: Campus Leader at Code Kutumb. September 2026: AWS Academy Graduate, Data Engineering and Cloud Foundations. June to August 2026: Python training and internship at PrernaGati and Technology. 2024 to 2028: B.Tech AI and Data Science at CGC University, Mohali.">
<title>Background timeline</title>
<defs>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1612"/><stop offset="1" stop-color="#0f0d0c"/></linearGradient>
  <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#b8915a" stop-opacity=".14"/><stop offset="1" stop-color="#b8915a" stop-opacity="0"/></radialGradient>
  
</defs>
<style>
  .ev{animation:e .8s ease-out backwards}
  @keyframes e{from{opacity:0;transform:translateY(8px)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="900" height="338" rx="14" fill="url(#p)"/>
<rect width="900" height="338" rx="14" fill="url(#g)"/>
<rect x=".5" y=".5" width="899" height="337" rx="14" fill="none" stroke="#2e2823"/>
<rect x="231.5" y="48" width="1" height="234" fill="#2e2823"/>
<g class="ev" style="animation-delay:0.2s"><circle class="pulse" cx="232" cy="48" r="6" fill="#c2693a"/><circle cx="232" cy="48" r="11" fill="none" stroke="#c2693a" stroke-opacity=".35"/><text x="204" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" letter-spacing="1.5" fill="#c2693a">JUL 2026 – NOW</text><text x="262" y="49" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#ebe4d6">Campus Leader · Code Kutumb</text><text x="262" y="70" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#9a9184">Student tech community. One-year term: student engagement, technical initiatives, events.</text></g><g class="ev" style="animation-delay:0.4s"><circle cx="232" cy="126" r="6" fill="#b8915a"/><circle cx="232" cy="126" r="11" fill="none" stroke="#b8915a" stroke-opacity=".35"/><text x="204" y="130" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" letter-spacing="1.5" fill="#b8915a">SEP 2026</text><text x="262" y="127" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#ebe4d6">AWS Academy Graduate</text><text x="262" y="148" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#9a9184">Data Engineering (40 hours) and Cloud Foundations training badges.</text></g><g class="ev" style="animation-delay:0.6s"><circle cx="232" cy="204" r="6" fill="#b8915a"/><circle cx="232" cy="204" r="11" fill="none" stroke="#b8915a" stroke-opacity=".35"/><text x="204" y="208" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" letter-spacing="1.5" fill="#b8915a">JUN – AUG 2026</text><text x="262" y="205" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#ebe4d6">Python Training &amp; Internship · PrernaGati &amp; Technology</text><text x="262" y="226" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#9a9184">Hands-on Python program; commended by supervisor for consistent work.</text></g><g class="ev" style="animation-delay:0.8s"><circle cx="232" cy="282" r="6" fill="#8a9770"/><circle cx="232" cy="282" r="11" fill="none" stroke="#8a9770" stroke-opacity=".35"/><text x="204" y="286" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" letter-spacing="1.5" fill="#8a9770">2024 – 2028</text><text x="262" y="283" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#ebe4d6">B.Tech, AI &amp; Data Science · CGC University, Mohali</text><text x="262" y="304" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#9a9184">PTU-affiliated. Currently in Semester 5.</text></g>
</svg>
